{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>EventCrafter</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    {% block css_files %}
    <link href="{% static 'event/img/favicon-32x32.png' %}" rel="icon">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="{% static 'event/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/aos/aos.css' %}" rel="stylesheet ">

    <!-- Template Main CSS File -->
    <link href="{% static 'event/css/main.css' %}" rel="stylesheet">
    {% endblock %}
</head>

<body>
{% include 'partials/_header.html' %}
<main id="main">

    <!-- ======= Breadcrumbs ======= -->
    <div class="breadcrumbs">
        <div class="page-header d-flex align-items-center"
             style="background-image: url({% static 'event/img/create-event.jpg' %});">
            <div class="container position-relative">
                <div class="row d-flex justify-content-center">
                    <div class="col-lg-6 text-center">
                        <h2>Create Event</h2>
                        <p>Create, Join, Have Fun</p>
                    </div>
                </div>
            </div>
        </div>
        <nav>
            <div class="container">
                <ol>
                    <li><a href="{% url 'index' %}">Home</a></li>
                    <li>Create Event</li>
                </ol>
            </div>
        </nav>
    </div><!-- End Breadcrumbs -->

    <section id="create-comment" class="event-form">
        <div class="container mt-5">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="card">
                        <div class="card-header bg-primary text-white text-center">Event Form</div>
                        <div class="card-body">
                            <form action="create-event" method="POST" enctype="multipart/form-data">
                                {% csrf_token %}
                                {{ form.as_p }}
                                <div class="form-group">
                                    <button type="submit" class="btn btn-primary btn-lg btn-block mt-3">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

</main>
{% include 'partials/_footer.html' %}
</body>
</html>
