{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">

    <title>EventCrafter</title>
    <meta content="" name="description">
    <meta content="" name="keywords">

    {% block css_files %}
    <link href="{% static 'event/img/favicon-32x32.png' %}" rel="icon">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,600;1,700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
          rel="stylesheet">

    <!-- Vendor CSS Files -->
    <link href="{% static 'event/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/bootstrap-icons/bootstrap-icons.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/glightbox/css/glightbox.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/swiper/swiper-bundle.min.css' %}" rel="stylesheet">
    <link href="{% static 'event/vendor/aos/aos.css' %}" rel="stylesheet ">

    <!-- Template Main CSS File -->
    <link href="{% static 'event/css/main.css' %}" rel="stylesheet">
    {% endblock %}
</head>

<body>

<header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-between">

        <a href="{% url 'login' %}" class="logo d-flex align-items-center">
            <h1>EventCrafter</h1>
        </a>

    </div>
</header>

<section class="vh-100" style="background-color: #0e1d34">
    <div class="container py-5 h-100">
        <div class="row d-flex justify-content-center align-items-center h-100">
            <div class="col col-xl-10">
                <div class="card" style="border-radius: 1rem;">
                    <div class="row g-0">
                        <div class="col-md-6 col-lg-5 d-none d-md-block">
                            <img src="{% static 'event/img/sydney.jpg' %}"
                                 alt="login form" class="img-fluid" style="border-radius: 1rem 0 0 1rem;"/>
                        </div>
                        <div class="col-md-6 col-lg-7 d-flex align-items-center">
                            <div class="card-body p-4 p-lg-5 text-black">
                                <form action="login" method="POST">
                                    {% csrf_token %}
                                    <div class="d-flex align-items-center mb-3 pb-1">
                                        <img src="{% static 'event/img/eventcrafterlogo.jpg' %}"
                                             alt="login form" class="img-fluid" style="border-radius: 2rem 1 1 2rem;"/>
                                    </div>

                                    <h5 class="fw-normal mb-3 pb-3" style="letter-spacing: 1px;">Log in to your
                                        account</h5>

                                    <!-- Error Message -->
                                    {% if error %}
                                    <div class="alert alert-danger" role="alert">
                                        {{ error }}
                                    </div>
                                    {% endif %}

                                    <div class="form-outline mb-4">
                                        <input type="text" id="form2Example17" name="username" required
                                               class="form-control form-control-lg"/>
                                        <label class="form-label" for="form2Example17">Username</label>
                                    </div>

                                    <div class="form-outline mb-4">
                                        <input type="password" id="form2Example27" name="password" required
                                               class="form-control form-control-lg"/>
                                        <label class="form-label" for="form2Example27">Password</label>
                                    </div>

                                    <div class="pt-1 mb-4">
                                        <button class="btn btn-dark btn-lg btn-block" type="submit">Login</button>
                                    </div>
                                    <p class="mb-5 pb-lg-2" style="color: #808080;">Don't have an account? <strong><a
                                            href="account/register"
                                            style="color: #0e1d34; font-weight: bold;">Register here</a></strong>
                                    </p>
                                </form>

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>


{% include 'partials/_footer.html' %}
</body>

</html>
